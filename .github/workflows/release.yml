name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # macOS (Apple Silicon + Intel) and Windows (x86_64)
  # ------------------------------------------------------------------
  desktop:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: zephyr-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: zephyr-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zephyr-windows-x86_64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/zephyr ./zephyr
          tar -czf ${{ matrix.archive }} zephyr README.md LICENSE

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/zephyr.exe ./zephyr.exe
          Compress-Archive -Path zephyr.exe,README.md,LICENSE -DestinationPath ${{ matrix.archive }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Linux glibc targets (x86_64 and arm64 native)
  # ------------------------------------------------------------------
  linux:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: zephyr-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: zephyr-linux-arm64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        run: |
          cp target/${{ matrix.target }}/release/zephyr ./zephyr
          tar -czf ${{ matrix.archive }} zephyr README.md LICENSE

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 32-bit ARM Linux (Raspberry Pi 2/3, armv7)
  # ------------------------------------------------------------------
  linux-armv7:
    name: Build zephyr-linux-armv7.tar.gz
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
      CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
      AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Install ARM cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Build release binary
        run: cargo build --release --target armv7-unknown-linux-gnueabihf

      - name: Package archive
        run: |
          cp target/armv7-unknown-linux-gnueabihf/release/zephyr ./zephyr
          tar -czf zephyr-linux-armv7.tar.gz zephyr README.md LICENSE

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-linux-armv7.tar.gz
          path: zephyr-linux-armv7.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Linux musl targets (fully static: x86_64, aarch64, armv7)
  # Built with cross so no host libc dependency is introduced
  # ------------------------------------------------------------------
  linux-musl:
    name: Build ${{ matrix.archive }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            archive: zephyr-linux-x86_64-musl.tar.gz
          - target: aarch64-unknown-linux-musl
            archive: zephyr-linux-aarch64-musl.tar.gz
          - target: armv7-unknown-linux-musleabihf
            archive: zephyr-linux-armv7-musl.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build release binary with cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package archive
        run: |
          cp target/${{ matrix.target }}/release/zephyr ./zephyr
          tar -czf ${{ matrix.archive }} zephyr README.md LICENSE

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Android (Termux) targets built with Android NDK
  # ------------------------------------------------------------------
  android:
    name: Build ${{ matrix.archive }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            clang_prefix: aarch64-linux-android24
            archive: zephyr-android-arm64.tar.gz
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            clang_prefix: armv7a-linux-androideabi24
            archive: zephyr-android-armv7.tar.gz
          - abi: x86_64
            target: x86_64-linux-android
            clang_prefix: x86_64-linux-android24
            archive: zephyr-android-x86_64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build release binary
        run: |
          TOOLCHAIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TRIPLE_UPPER=$(echo "${{ matrix.target }}" | tr '-' '_' | tr '[:lower:]' '[:upper:]')
          TRIPLE_LOWER=$(echo "${{ matrix.target }}" | tr '-' '_')
          
          export "CARGO_TARGET_${TRIPLE_UPPER}_LINKER=${TOOLCHAIN}/${{ matrix.clang_prefix }}-clang"
          export "CC_${TRIPLE_LOWER}=${TOOLCHAIN}/${{ matrix.clang_prefix }}-clang"
          export "CXX_${TRIPLE_LOWER}=${TOOLCHAIN}/${{ matrix.clang_prefix }}-clang++"
          export "AR_${TRIPLE_LOWER}=${TOOLCHAIN}/llvm-ar"
          
          cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        run: |
          cp target/${{ matrix.target }}/release/zephyr ./zephyr
          tar -czf ${{ matrix.archive }} zephyr README.md LICENSE

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Publish Release with SHA256 checksums
  # ------------------------------------------------------------------
  release:
    name: Publish GitHub release
    needs: [desktop, linux, linux-armv7, linux-musl, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          shopt -s nullglob
          files=(*.tar.gz *.zip)
          for f in "${files[@]}"; do
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          echo "=== Generated SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/**/*
