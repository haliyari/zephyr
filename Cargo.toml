[package]
name = "zephyr"
version = "0.1.0"
edition = "2021"
authors = ["Hossein Aliyari"]
description = "Pure 100% Rust userspace MS-SSTP client & dual SOCKS5/HTTP proxy"
license = "GPL-3.0-or-later"
keywords = ["vpn", "sstp", "proxy", "socks5", "censorship-circumvention"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
ureq = { version = "2.9", features = ["gzip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
